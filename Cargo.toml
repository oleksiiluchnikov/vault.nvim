[package]
name = "vault_core"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"


[lib]
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.9.9", features = ["luajit", "module", "serialize"] }
walkdir = "2"
rayon = "1.7"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.18"

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]
